version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:5000/api
    depends_on:
      - backend
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/agricloud_ml
      - JWT_SECRET=agricloud_production_secure_jwt_token_2026
      - STORAGE_MODE=local
      - ML_MODE=real
      - ML_SERVICE_URL=http://ml-service:8000
    volumes:
      - backend-uploads:/app/uploads
    depends_on:
      - mongo
      - ml-service
    restart: always

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    restart: always

  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always

volumes:
  backend-uploads:
  mongo-data:
